appId: com.project-manager
productName: 项目管理器
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - dist/**/*
  - assets/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 项目管理器
  uninstallDisplayName: 项目管理器 ${version}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  license: LICENSE.txt

extraResources:
  - from: assets/
    to: assets/
    filter:
      - "**/*"
